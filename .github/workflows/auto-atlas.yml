name: auto-atlas

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: auto-atlas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Regenerate structure blocks only
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse

          EXT = {
              '.rkt': '🟪', '.c': '⚪', '.h': '⚪', '.java': '🟠',
              '.js': '🟡', '.py': '🔵', '.md': '📖', '.yml': '⚙️',
              '.yaml': '⚙️', '.json': '🧾', '.txt': '📄',
          }
          LANGS = [('.rkt', '🟪'), ('.c', '⚪'), ('.java', '🟠'),
                   ('.js', '🟡'), ('.py', '🔵')]
          CODE = {e for e, _ in LANGS}
          SMALL = {'i': 'I', 'ii': 'II', 'iii': 'III', 'iv': 'IV'}
          PROB = re.compile(r'^(\d+)[.\-\s_]+(.*)$')
          T_START = '<!-- AUTO-TREE:START -->'
          T_END = '<!-- AUTO-TREE:END -->'
          L_START = '<!-- AUTO-LEDGER:START -->'
          L_END = '<!-- AUTO-LEDGER:END -->'

          def icon(name):
              if name == 'LICENSE':
                  return '⚖️'
              return EXT.get(os.path.splitext(name)[1].lower(), '📄')

          def clean_title(raw):
              t = re.sub(r'\s+', ' ', raw.replace('-', ' ').replace('_', ' ')).strip()
              out = []
              for w in t.split(' '):
                  if not w:
                      continue
                  if len(w) > 1 and any(ch.isupper() for ch in w):
                      out.append(w)
                  elif w.lower() in SMALL:
                      out.append(SMALL[w.lower()])
                  else:
                      out.append(w.capitalize())
              return ' '.join(out)

          lines = []
          state = {'files': 0, 'dirs': 0}

          def walk(path, prefix):
              names = [n for n in os.listdir(path) if n != '.git']
              names.sort(key=lambda n: (not os.path.isdir(os.path.join(path, n)), n.lower()))
              for i, name in enumerate(names):
                  full = os.path.join(path, name)
                  last = i == len(names) - 1
                  branch = '└── ' if last else '├── '
                  if os.path.isdir(full):
                      state['dirs'] += 1
                      lines.append(prefix + branch + '📁 ' + name + '/')
                      walk(full, prefix + ('    ' if last else '│   '))
                  else:
                      state['files'] += 1
                      lines.append(prefix + branch + icon(name) + ' ' + name)

          if not os.path.exists('README.md'):
              raise SystemExit('README.md missing; nothing to atlas')

          repo = os.environ.get('GITHUB_REPOSITORY', 'repo').split('/')[-1]
          walk('.', '')
          tree = T_START + '\n```text\n📦 ' + repo + '/\n' + '\n'.join(lines) + '\n```\n\n📊 ' + \
                 str(state['files']) + ' files · ' + str(state['dirs']) + ' folders\n' + T_END

          found = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              m = PROB.match(os.path.basename(root))
              if m:
                  found.append((os.path.relpath(root, '.'), int(m.group(1)), m.group(2)))
          kept = [f for f in found
                  if not any(f[0] != o[0] and f[0].startswith(o[0] + os.sep) for o in found)]
          entries = []
          total = 0
          for rel, num, raw in sorted(kept, key=lambda t: (t[1], t[0])):
              exts = set()
              count = 0
              for r2, d2, f2 in os.walk(rel):
                  for f in f2:
                      count += 1
                      e = os.path.splitext(f)[1].lower()
                      if e in CODE:
                          exts.add(e)
              total += count
              meter = ''.join(g if e in exts else '⬜' for e, g in LANGS)
              link = urllib.parse.quote(rel.replace(os.sep, '/'))
              entries.append('- [x] **' + str(num) + ' · ' + clean_title(raw) + '** · ' + meter +
                             ' · ' + str(count) + ' files · [dossier](' + link + ')')
          ledger = L_START + '\n' + '\n'.join(entries) + '\n\n📊 ' + \
                   str(len(entries)) + ' problems · ' + str(total) + ' files inside dossiers\n' + L_END

          with open('README.md', 'r', encoding='utf-8') as fh:
              content = fh.read()
          for start, end, block in ((T_START, T_END, tree), (L_START, L_END, ledger)):
              pat = re.compile(re.escape(start) + '.*?' + re.escape(end), re.S)
              if pat.search(content):
                  content = pat.sub(lambda m, b=block: b, content, count=1)
              else:
                  content = content.rstrip() + '\n\n' + block + '\n'
          with open('README.md', 'w', encoding='utf-8') as fh:
              fh.write(content)
          print('tree lines:', len(lines), '| vault entries:', len(entries))
          PY

      - name: Commit regenerated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README already up to date"
          else
            git commit -m "chore: regenerate structure blocks only [auto-atlas]"
            git push
          fi
