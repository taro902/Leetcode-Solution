name: auto-tree

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: auto-tree
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Regenerate structure block
        run: |
          python3 - <<'PY'
          import os, re

          EXT = {
              '.rkt': '🟪', '.c': '⚪', '.h': '⚪', '.java': '🟠',
              '.js': '🟡', '.py': '🔵', '.md': '📖', '.yml': '⚙️',
              '.yaml': '⚙️', '.json': '🧾', '.txt': '📄',
          }
          CODE = {'.rkt', '.c', '.java', '.js', '.py'}
          START = '<!-- AUTO-TREE:START -->'
          END = '<!-- AUTO-TREE:END -->'

          def icon(name):
              if name == 'LICENSE':
                  return '⚖️'
              return EXT.get(os.path.splitext(name)[1].lower(), '📄')

          lines = []
          state = {'files': 0, 'dirs': 0, 'langs': set()}

          def walk(path, prefix):
              names = [n for n in os.listdir(path) if n != '.git']
              names.sort(key=lambda n: (not os.path.isdir(os.path.join(path, n)), n.lower()))
              for i, name in enumerate(names):
                  full = os.path.join(path, name)
                  last = i == len(names) - 1
                  branch = '└── ' if last else '├── '
                  if os.path.isdir(full):
                      state['dirs'] += 1
                      lines.append(prefix + branch + '📁 ' + name + '/')
                      walk(full, prefix + ('    ' if last else '│   '))
                  else:
                      state['files'] += 1
                      ext = os.path.splitext(name)[1].lower()
                      if ext in CODE:
                          state['langs'].add(ext)
                      lines.append(prefix + branch + icon(name) + ' ' + name)

          repo = os.environ.get('GITHUB_REPOSITORY', 'repo').split('/')[-1]
          walk('.', '')
          tree = '📦 ' + repo + '/\n' + '\n'.join(lines)
          stats = (str(state['files']) + ' files · ' +
                   str(state['dirs']) + ' folders · ' +
                   str(len(state['langs'])) + ' solution languages')
          block = START + '\n```text\n' + tree + '\n```\n\n📊 ' + stats + '\n' + END

          with open('README.md', 'r', encoding='utf-8') as fh:
              content = fh.read()
          pattern = re.compile(re.escape(START) + '.*?' + re.escape(END), re.S)
          if pattern.search(content):
              content = pattern.sub(lambda m: block, content, count=1)
          else:
              content = content.rstrip() + '\n\n' + block + '\n'
          with open('README.md', 'w', encoding='utf-8') as fh:
              fh.write(content)
          print('tree lines:', len(lines))
          PY

      - name: Commit regenerated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README already up to date"
          else
            git commit -m "chore: regenerate repository structure [auto-tree]"
            git push
          fi
